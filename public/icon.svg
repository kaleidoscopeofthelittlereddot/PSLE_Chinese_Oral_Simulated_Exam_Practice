  <circle cx="256" cy="310" r="10" fill="#D32F2F"/>
  
  <!-- Stylized Colorful Text Arc (Circles to represent playful text curve) -->
  <circle cx="110" cy="400" r="8" fill="#EF5350"/>
  <circle cx="140" cy="420" r="9" fill="#42A5F5"/>
  <circle cx="175" cy="435" r="7" fill="#66BB6A"/>
  <circle cx="215" cy="445" r="9" fill="#EF5350"/>
  <circle cx="256" cy="448" r="8" fill="#FF9800"/>
