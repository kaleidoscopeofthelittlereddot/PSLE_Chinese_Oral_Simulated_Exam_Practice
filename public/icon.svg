<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#FFFDF7" rx="112"/>
  
  <!-- Outer circular border to mimic the original logo ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#F4CDCD" stroke-width="8"/>
  
  <!-- Rainbow Arches (center at 256, 310) -->
  <path d="M 66 310 A 190 190 0 0 1 446 310" fill="none" stroke="#EF5350" stroke-width="20" stroke-linecap="round"/>
  <path d="M 91 310 A 165 165 0 0 1 421 310" fill="none" stroke="#FF9800" stroke-width="20" stroke-linecap="round"/>
  <path d="M 116 310 A 140 140 0 0 1 396 310" fill="none" stroke="#FFCA28" stroke-width="20" stroke-linecap="round"/>
  <path d="M 141 310 A 115 115 0 0 1 371 310" fill="none" stroke="#66BB6A" stroke-width="20" stroke-linecap="round"/>
